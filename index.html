<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Story</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23374A4F'/%3E%3Cpath d='M16 26V11' stroke='%23A98B52' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M16 15c0-4 3-7 7-7 0 4-3 7-7 7zM16 15c0-4-3-7-7-7 0 4 3 7 7 7z' fill='%237D8C6F'/%3E%3Cpath d='M16 22c0-3.2 2.4-5.6 5.6-5.6 0 3.2-2.4 5.6-5.6 5.6z' fill='%23B9697A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0..100,0..1;1,9..144,400..700,0..100,0..1&family=Manrope:wght@400..700&display=swap" rel="stylesheet">
<script>
/* set the saved theme before first paint so the app never flashes the wrong one */
try {
  var saved = JSON.parse(localStorage.getItem('twosides:data:v1') || '{}').theme;
  if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
} catch (e) {}
</script>
<link rel="stylesheet" href="css/hands.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/book.css">
<link rel="stylesheet" href="css/games.css">
<link rel="stylesheet" href="css/intro.css">
<link rel="stylesheet" href="css/hamilton.css">
</head>
<body>

<div class="aurora" aria-hidden="true"><b></b><b></b><b></b></div>
<div class="sparkles" id="sparkles" aria-hidden="true"></div>

<!-- ============ INTRO: the pixel park ============ -->
<!--
  A hand-authored pixel scene: he walks into the park, she arrives with the
  cake, and the heart they raise over it swallows the screen.

  Everything is drawn into a 256x144 buffer and blown up with nearest-neighbour
  scaling at an integer factor, so every pixel stays a hard, equal-sized square.
  The two people are Liberated Pixel Cup artwork and the cake is from
  OpenGameArt, both recoloured to this palette and baked into img/. The park
  itself is generated. js/intro.js owns the scene and the timing.
-->
<div id="intro" aria-hidden="true">
  <canvas id="introCanvas"></canvas>
</div>

<!-- ============ LOGIN ============ -->
<section id="login" class="scene" aria-label="Sign in">
  <div class="photo-field" id="photoField" aria-hidden="true"></div>

  <div class="orb-wrap" id="orbWrap">
    <div class="orb-glow" aria-hidden="true"></div>
    <div class="orb-glow two" aria-hidden="true"></div>
    <div class="orb">
      <div class="orb-face" id="orbLogin">
        <h1 class="orb-title">Hellow</h1>
        <p class="orb-sub">two sides, one story</p>
        <input id="inName" class="field" type="text" placeholder="Your name" aria-label="Your name" autocomplete="nickname" maxlength="24">
        <input id="inPass" class="field" type="password" placeholder="Secret word" aria-label="Secret word" autocomplete="off">
        <button id="btnEnter" class="go" type="button">Step inside</button>
        <p id="orbMsg" class="orb-msg" role="status" aria-live="polite"></p>
      </div>
      <div class="orb-loading" id="orbLoading" aria-live="polite">
        <div class="lh" aria-hidden="true">&#9829;</div>
        <div class="lm" id="loadMsg">Gathering our memories&hellip;</div>
        <div class="lp" id="loadPct">0%</div>
      </div>
    </div>
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#d4588a"/><stop offset=".5" stop-color="#c9922e"/><stop offset="1" stop-color="#a06ad8"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="50" cy="50" r="48"/>
      <circle class="prog" id="ringProg" cx="50" cy="50" r="48"/>
    </svg>
    <div class="ring-dot" id="ringDot" aria-hidden="true"></div>
  </div>

  <div class="login-tools">
    <button class="pill" id="btnLoginPhotos" type="button">Add our photos</button>
    <span class="pill" id="photoCount" style="display:none"></span>
    <button class="pill quiet" id="btnClearPhotos" type="button" style="display:none">Clear photos</button>
    <input type="file" id="fileLogin" accept="image/*" multiple hidden>
  </div>
</section>

<!-- ============ APP SHELL ============ -->
<section id="app" class="scene off" aria-label="Our storybook">
  <header class="topbar">
    <div class="brand"><span class="h" aria-hidden="true">&#10086;</span><span id="brandName">Our Story</span></div>
    <button class="pill" id="btnMenu" type="button" aria-expanded="false" aria-controls="sideMenu">Menu</button>
  </header>

  <div class="side-menu" id="sideMenu">
    <button class="pill" id="btnTheme" type="button" aria-pressed="false">Lamplight</button>
    <button class="pill" id="btnSideGames" type="button">Games</button>
    <button class="pill" id="btnSideMusic" type="button">Music</button>
    <button class="pill" id="btnSettings" type="button">Settings</button>
    <button class="pill quiet" id="btnLogout" type="button">Log out</button>
  </div>

  <main class="stage" id="stage">
    <div class="book-shell" id="shell">
      <div class="tabs" id="tabs" role="navigation" aria-label="Bookmarks"></div>
      <div class="book" id="book">
        <div class="board board-l"></div>
        <div class="board board-r"></div>
        <div class="spine"></div>
      </div>
    </div>
  </main>
  <footer class="navbar">
    <button class="pill" id="prev" type="button">&lsaquo; Previous</button>
    <div class="nav-label" id="navLabel" aria-live="polite">The cover</div>
    <button class="pill" id="next" type="button">Next &rsaquo;</button>
  </footer>
  <input type="file" id="fileBook" accept="image/*" multiple hidden>
</section>

<!-- ============ GAMES SCREEN ============ -->
<section id="gamesScreen" class="scene off" aria-label="Game room">
  <header class="topbar">
    <div class="brand"><span class="h" aria-hidden="true">&#9829;</span><span>Game Room</span></div>
    <button class="pill" id="btnBackToBook" type="button">Back to Book</button>
  </header>

  <!-- picker (cards are generated from the GAMES list in js/games.js) -->
  <div id="gamesContainer" class="games-grid"></div>

  <!-- where the chosen game plays -->
  <div id="gameStage" class="game-stage" hidden>
    <div class="stage-bar">
      <button class="pill" id="btnAllGames" type="button">&lsaquo; All games</button>
      <h2 id="gameTitle"></h2>
    </div>
    <div id="gameBody" class="game-body"></div>
  </div>
</section>

<!-- ============ MODALS & TOASTS ============ -->
<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ============ MUSIC PLAYER ============ -->
<div id="musicPlayer" class="floating-music off">
  <button id="closeMusic" class="x-btn" type="button" aria-label="Close music">&times;</button>
  <button id="minMusic" class="min-btn" type="button" aria-label="Minimize music">&minus;</button>
  <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/1uB1WSpITsV65IBDXfTSSB?utm_source=generator&theme=0&si=bed5f1d2e30644aa" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
</div>

<script src="js/helpers.js"></script>
<script src="js/data.js"></script>
<script src="js/book.js"></script>
<script src="js/games.js"></script>
<script src="js/intro.js"></script>
<script src="js/app.js"></script>
<script src="js/hamilton.js"></script>
<script src="js/cursor.js"></script>
<script src="js/orb.js"></script>
</body>
</html>
